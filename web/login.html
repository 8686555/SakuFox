<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="login_title">SakuFox 登录</title>
  <link rel="stylesheet" href="/web/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-header">
      <div class="logo-icon"><i class="fa-solid fa-user-shield"></i></div>
      <h1>SakuFox</h1>
      <p class="login-subtitle" data-i18n="login_subtitle">注册或登录后开始共享分析经验</p>
    </div>

    <div class="login-controls" style="margin-bottom: 14px;">
      <button id="loginModeBtn" class="btn btn-primary btn-block" type="button">
        <i class="fa-solid fa-right-to-bracket"></i> <span data-i18n="login_mode_signin">登录</span>
      </button>
      <button id="registerModeBtn" class="btn btn-outline btn-block" type="button">
        <i class="fa-solid fa-user-plus"></i> <span data-i18n="login_mode_register">注册</span>
      </button>
    </div>

    <form id="localLoginForm" class="login-form">
      <input id="usernameInput" name="username" autocomplete="username" data-i18n="login_username" placeholder="用户名" />
      <input id="passwordInput" name="password" type="password" autocomplete="current-password" data-i18n="login_password" placeholder="密码" />
      <input id="displayNameInput" name="display_name" autocomplete="name" data-i18n="login_display_name" placeholder="显示名称（可选）" style="display:none;" />
      <button id="submitLoginBtn" class="btn btn-primary btn-block" type="submit">
        <i class="fa-solid fa-right-to-bracket"></i> <span data-i18n="login_submit">登录</span>
      </button>
    </form>

    <label class="login-footer" style="display:flex; align-items:center; justify-content:center; gap:8px;">
      <i class="fa-solid fa-language"></i>
      <select id="langSelect" data-lang-select style="border:0; background:transparent; color:inherit; font:inherit; font-weight:700; outline:none; cursor:pointer;">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </label>

    <div id="oauthProviders" class="login-controls"></div>
    <div id="loginMessage" class="login-footer"></div>
  </main>

  <script src="/web/common.js"></script>
  <script src="/web/login.js"></script>
</body>
</html>
