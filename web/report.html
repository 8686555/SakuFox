<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analysis Report</title>
  <link rel="stylesheet" href="/web/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <style>
    html, body { height: 100%; overflow-y: auto; }
    body { margin: 0; background: #f8fafc; color: #0f172a; font-family: Inter, Arial, sans-serif; padding-bottom: 118px; }
    .report-shell { max-width: 1280px; margin: 0 auto; padding: 16px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .meta { font-size: 12px; color: #64748b; }
    .actions { display: flex; gap: 8px; }
    .frame-wrap { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: auto; min-height: 72vh; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
    #reportFrame { width: 100%; border: 0; min-height: 72vh; height: 80vh; background: #fff; display: block; overflow: auto; }
    .loading { padding: 30px; text-align: center; color: #64748b; }
    .error { padding: 20px; color: #dc2626; font-size: 14px; }
    .report-chat-dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 12px 16px 14px; background: rgba(248,250,252,.94); border-top: 1px solid #e2e8f0; box-shadow: 0 -18px 40px rgba(15,23,42,.08); backdrop-filter: blur(14px); }
    .report-chat-inner { max-width: 980px; margin: 0 auto; }
    .report-chat-status { min-height: 20px; margin: 0 8px 8px; color: #475569; font-size: 12px; line-height: 1.5; }
    .report-chat-row { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid #dbe5ef; border-radius: 16px; background: #fff; box-shadow: 0 10px 28px rgba(15,23,42,.08); }
    #reportChatInput { flex: 1; min-width: 0; border: 0; outline: 0; padding: 10px 12px; font-size: 14px; color: #0f172a; background: transparent; }
    #reportChatInput::placeholder { color: #94a3b8; }
    #reportChatSend { min-width: 78px; justify-content: center; }
    @media print {
      body { padding-bottom: 0; }
      .toolbar, .report-chat-dock { display: none; }
      .report-shell { max-width: none; margin: 0; padding: 0; }
      .frame-wrap { border: none; border-radius: 0; }
    }
    @media (max-width: 640px) {
      body { padding-bottom: 132px; }
      .report-chat-dock { padding: 10px; }
      .report-chat-row { border-radius: 14px; }
      #reportChatSend { min-width: 64px; padding-left: 10px; padding-right: 10px; }
    }
  </style>
</head>
<body>
  <div class="report-shell">
    <div class="toolbar">
      <div></div>
      <div class="actions">
        <button id="btnBack" class="btn btn-outline btn-sm"><i class="fa-solid fa-arrow-left"></i> Back To Chat</button>
        <button id="btnPrint" class="btn btn-primary btn-sm"><i class="fa-solid fa-file-pdf"></i> Export PDF</button>
      </div>
    </div>
    <div class="frame-wrap">
      <div id="loading" class="loading">Loading report...</div>
      <div id="error" class="error" style="display:none;"></div>
      <iframe id="reportFrame" sandbox="allow-same-origin allow-modals" style="display:none;"></iframe>
    </div>
  </div>
  <div class="report-chat-dock">
    <div class="report-chat-inner">
      <div id="reportChatStatus" class="report-chat-status"></div>
      <div class="report-chat-row">
        <input id="reportChatInput" autocomplete="off" placeholder="提出展示修改要求..." />
        <button id="reportChatSend" class="btn btn-primary btn-sm" type="button">发送</button>
      </div>
    </div>
  </div>
  <script src="/web/report.js"></script>
</body>
</html>
